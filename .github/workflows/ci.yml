name: CI

# Actions are pinned to commit SHAs, not tags. A tag like @v4 can be moved to a
# different commit by whoever owns the action, which would silently change what
# runs in this pipeline. The version each SHA corresponds to is in the comment.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default: only the job that publishes images gets write
# access to packages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: starter/.nvmrc

      - name: Determine affected packages
        id: affected
        working-directory: starter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"

          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "--- changed files ---"
          echo "$CHANGED_FILES"

          RESULT=$(node scripts/affected-packages.js $CHANGED_FILES)
          echo "--- affected-packages.js output ---"
          echo "$RESULT"

          PACKAGES=$(echo "$RESULT" | jq -r '.affectedPackages | join(" ")')
          SERVICES=$(echo "$RESULT" | jq -r '.affectedServices | join(" ")')

          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: starter
        run: npm ci

      # Fails on high and critical only. Moderate findings stay visible in the
      # log but do not block, otherwise the gate gets bypassed and stops meaning
      # anything.
      - name: Audit dependencies
        working-directory: starter
        run: npm audit --audit-level=high

      - name: Run tests for affected packages
        working-directory: starter
        run: |
          echo "Testing: ${{ steps.affected.outputs.packages }}"
          FLAGS=""
          for pkg in ${{ steps.affected.outputs.packages }}; do
            FLAGS="$FLAGS -w $pkg"
          done
          npm test $FLAGS

  build:
    needs: test
    runs-on: ubuntu-latest
    if: needs.test.outputs.services != ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scanning happens between build and push, so an image that fails the
      # policy never reaches the registry. Trivy runs as a container for the
      # same reason Terraform does: the version is pinned here, not inherited
      # from the runner.
      - name: Build, scan and push affected service images
        working-directory: starter
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for dir in ${{ needs.test.outputs.services }}; do
            service=$(basename "$dir")
            tag="ghcr.io/$OWNER/$service:${{ github.sha }}"

            echo "::group::build $service"
            docker build -f "$dir/Dockerfile" -t "$tag" .
            echo "::endgroup::"

            echo "::group::scan $service"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${{ github.workspace }}/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:0.73.0 image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile /.trivyignore \
              "$tag"
            echo "::endgroup::"

            docker push "$tag"
          done

  deploy-staging:
    needs: [test, build]
    if: needs.test.outputs.services != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # floci pulls images through the host Docker daemon, so this VM needs its
      # own registry credentials — the build job's login lives on another VM.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # floci runs Cloud Run containers through the host Docker daemon, so it
      # needs the socket mounted — this is what `floci gcp start` does for you
      # locally, and omitting it makes every deploy fail with a socket error.
      - name: Start floci-gcp
        run: |
          docker run -d --name floci-gcp \
            -p 4588:4588 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            floci/floci-gcp:latest
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:4588/v1/projects/readiness-probe/secrets" >/dev/null; then
              echo "floci is ready"
              exit 0
            fi
            sleep 2
          done
          echo "floci did not become ready" >&2
          docker logs floci-gcp
          exit 1

      # The same entrypoint a developer runs locally — there is no CI-only
      # deploy path that could drift from it.
      - name: Deploy staging
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          AFFECTED_SERVICES: ${{ needs.test.outputs.services }}
          INVENTORY_API_TOKEN: ${{ secrets.INVENTORY_API_TOKEN }}
          NOTIFICATIONS_API_TOKEN: ${{ secrets.NOTIFICATIONS_API_TOKEN }}
        run: ./scripts/deploy.sh staging

      - name: Integration tests
        run: ./scripts/integration-test.sh staging

      - name: Negative path — services fail closed without their secrets
        run: ./scripts/test-missing-secret.sh

      - name: Emulator logs on failure
        if: failure()
        run: docker logs floci-gcp
