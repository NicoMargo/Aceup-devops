name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/.nvmrc

      - name: Determine affected packages
        id: affected
        working-directory: starter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"

          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "--- changed files ---"
          echo "$CHANGED_FILES"

          RESULT=$(node scripts/affected-packages.js $CHANGED_FILES)
          echo "--- affected-packages.js output ---"
          echo "$RESULT"

          PACKAGES=$(echo "$RESULT" | jq -r '.affectedPackages | join(" ")')
          SERVICES=$(echo "$RESULT" | jq -r '.affectedServices | join(" ")')

          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: starter
        run: npm ci

      - name: Run tests for affected packages
        working-directory: starter
        run: |
          echo "Testing: ${{ steps.affected.outputs.packages }}"
          FLAGS=""
          for pkg in ${{ steps.affected.outputs.packages }}; do
            FLAGS="$FLAGS -w $pkg"
          done
          npm test $FLAGS

  build:
    needs: test
    runs-on: ubuntu-latest
    if: needs.test.outputs.services != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push affected service images
        working-directory: starter
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for dir in ${{ needs.test.outputs.services }}; do
            service=$(basename "$dir")
            tag="ghcr.io/$OWNER/$service:${{ github.sha }}"
            echo "Building $service from $dir -> $tag"
            docker build -f "$dir/Dockerfile" -t "$tag" .
            docker push "$tag"
          done

  deploy-staging:
    needs: [test, build]
    if: needs.test.outputs.services != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # floci pulls images through the host Docker daemon, so this VM needs its
      # own registry credentials — the build job's login lives on another VM.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start floci-gcp
        run: |
          docker run -d --name floci-gcp -p 4588:4588 floci/floci-gcp:latest
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:4588/v1/projects/readiness-probe/secrets" >/dev/null; then
              echo "floci is ready"
              exit 0
            fi
            sleep 2
          done
          echo "floci did not become ready" >&2
          docker logs floci-gcp
          exit 1

      # The same entrypoint a developer runs locally — there is no CI-only
      # deploy path that could drift from it.
      - name: Deploy staging
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          AFFECTED_SERVICES: ${{ needs.test.outputs.services }}
          INVENTORY_API_TOKEN: ${{ secrets.INVENTORY_API_TOKEN }}
          NOTIFICATIONS_API_TOKEN: ${{ secrets.NOTIFICATIONS_API_TOKEN }}
        run: ./scripts/deploy.sh staging

      - name: Integration tests
        run: ./scripts/integration-test.sh staging

      - name: Negative path — services fail closed without their secrets
        run: ./scripts/test-missing-secret.sh

      - name: Emulator logs on failure
        if: failure()
        run: docker logs floci-gcp
