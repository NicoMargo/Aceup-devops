name: CI

on:
  pull_request:
  push:        
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version-file: starter/.nvmrc

      - name: Determine affected packages
        id: affected
        working-directory: starter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"

          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "--- changed files ---"
          echo "$CHANGED_FILES"

          RESULT=$(node scripts/affected-packages.js $CHANGED_FILES)
          echo "--- affected-packages.js output ---"
          echo "$RESULT"

          PACKAGES=$(echo "$RESULT" | jq -r '.affectedPackages | join(" ")')
          SERVICES=$(echo "$RESULT" | jq -r '.affectedServices | join(" ")')

          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
        
      - name: Install dependencies
          working-directory: starter
          run: npm ci