name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/.nvmrc

      - name: Install dependencies
        working-directory: starter
        run: npm ci

      - name: Run all tests
        working-directory: starter
        run: npm test